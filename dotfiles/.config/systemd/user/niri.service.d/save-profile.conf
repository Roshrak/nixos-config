[Service]
# Persist this session's Noctalia state into the niri seed whenever the
# unit stops (logout, crash, greetd teardown) so in-session customizations
# (palette source, scheme, wallpaper) survive to the next login.
# Pure file copy - no target starts, no transaction conflicts.
ExecStopPost=/home/aesc/.local/bin/save-noctalia-profile niri
