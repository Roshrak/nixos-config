[theme.templates]
enable_builtin_templates = false
enable_community_templates = false
builtin_ids = []
community_ids = []

[theme.templates.user.kitty]
input_path = "/run/current-system/sw/share/noctalia/assets/templates/kitty/kitty.conf"
output_path = "/home/aesc/.config/kitty/profiles/hyprland/theme.conf"
post_hook = "pkill -SIGUSR1 -u $(id -u) -x kitty || true"

[theme.templates.user.gtk3]
input_path = "/run/current-system/sw/share/noctalia/assets/templates/gtk/gtk3.css"
output_path = [
  "/home/aesc/.local/state/theme-profiles/hyprland/generated/gtk3/noctalia.css",
  "/home/aesc/.config/gtk-3.0/theme-active.css"
]

[theme.templates.user.gtk4]
input_path = "/run/current-system/sw/share/noctalia/assets/templates/gtk/gtk4.css"
output_path = [
  "/home/aesc/.local/state/theme-profiles/hyprland/generated/gtk4/noctalia.css",
  "/home/aesc/.config/gtk-4.0/theme-active.css"
]

[theme.templates.user.qt]
input_path = "/run/current-system/sw/share/noctalia/assets/templates/qt/qtct.conf"
output_path = [
  "/home/aesc/.local/state/theme-profiles/hyprland/generated/qt/noctalia.conf",
  "/home/aesc/.config/qt5ct/colors/noctalia.conf",
  "/home/aesc/.config/qt6ct/colors/noctalia.conf"
]
