config_version = 13

[bar.default]
background_opacity = 0.34999999217689037
border = "primary"
capsule_border = "primary"
capsule_thickness = 0.63999998942017555
color = "on_surface"
concave_edge_corners = false
end = [ "media", "tray", "notifications", "clipboard", "network", "bluetooth", "battery", "session" ]
icon_color = "secondary"
margin_ends = 0
panel_overlap = 0
radius = 0
start = [ "launcher", "workspaces" ]
thickness = 30

[desktop_widgets]
enabled = false

[location]
auto_locate = true

[lockscreen]
monitors = [ "eDP-1" ]

[lockscreen_widgets]
enabled = true
schema_version = 2
widget_order = [ "lockscreen-login-box@HEADLESS-1", "lockscreen-login-box@HDMI-A-1", "lockscreen-login-box@eDP-1" ]

    [lockscreen_widgets.grid]
    cell_size = 16
    major_interval = 4
    visible = true

    [lockscreen_widgets.widget."lockscreen-login-box@HDMI-A-1"]
    box_height = 196.0
    box_width = 810.0
    cx = 960.0
    cy = 898.0
    output = "HDMI-A-1"
    placement_height = 1080.0
    placement_width = 1920.0
    rotation = 0.0
    type = "login_box"

        [lockscreen_widgets.widget."lockscreen-login-box@HDMI-A-1".settings]
        background_color = "surface_variant"
        background_opacity = 0.88
        background_radius = 12.0
        center_password_text = false
        input_opacity = 1.0
        input_radius = 6.0
        layout = "regular"
        show_caps_lock = true
        show_keyboard_layout = true
        show_login_button = true
        show_media = true
        show_session_buttons = true
        show_unlock_hint = true
        show_weather = true

    [lockscreen_widgets.widget."lockscreen-login-box@HEADLESS-1"]
    box_height = 196.0
    box_width = 810.0
    cx = 1200.0
    cy = 898.0
    output = "HEADLESS-1"
    placement_height = 0.0
    placement_width = 0.0
    rotation = 0.0
    type = "login_box"

        [lockscreen_widgets.widget."lockscreen-login-box@HEADLESS-1".settings]
        background_color = "surface_variant"
        background_opacity = 0.88
        background_radius = 12.0
        center_password_text = false
        input_opacity = 1.0
        input_radius = 6.0
        layout = "regular"
        show_caps_lock = true
        show_keyboard_layout = true
        show_login_button = true
        show_media = true
        show_session_buttons = true
        show_unlock_hint = true
        show_weather = true

    [lockscreen_widgets.widget."lockscreen-login-box@eDP-1"]
    box_height = 196.0
    box_width = 810.0
    cx = 960.0
    cy = 1018.0
    output = "eDP-1"
    placement_height = 1200.0
    placement_width = 1920.0
    rotation = 0.0
    type = "login_box"

        [lockscreen_widgets.widget."lockscreen-login-box@eDP-1".settings]
        background_color = "surface_variant"
        background_opacity = 0.88
        background_radius = 12.0
        center_password_text = false
        input_opacity = 1.0
        input_radius = 6.0
        layout = "regular"
        show_caps_lock = true
        show_keyboard_layout = true
        show_login_button = true
        show_media = true
        show_session_buttons = true
        show_unlock_hint = true
        show_weather = true

[shell]
button_borders = false
corner_radius_scale = 0.0
password_style = "random"

    [shell.greeter_sync]
    auto_sync = false
    privilege_command = "/home/aesc/.local/bin/noctalia-greeter-sync-smart"

    [shell.launcher]
    app_grid = true

    [shell.panel]
    control_center_placement = "floating"
    control_center_position = "top_center"
    floating_offset = 5
    transparency_mode = "glass"

